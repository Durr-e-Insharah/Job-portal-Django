{% extends 'base.html' %}
{% block content %}
<h1>Available Jobs</h1>
{% for job in all_jobs %}
    <div class="job-card">
        <h3><a href="{% url 'job_detail' job.pk %}">{{ job.title }}</a></h3>
        <p>{{ job.company }} — {{ job.location }} — ₹{{ job.salary }}</p>
    </div>
{% empty %}
    <p class="empty-state">No jobs posted yet.</p>
{% endfor %}
{% endblock %}
